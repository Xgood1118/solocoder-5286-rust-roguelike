[package]
name = "roguelike"
version = "0.1.0"
edition = "2021"
description = "A Rust + Bevy Roguelike dungeon game"

[features]
default = []
dynamic = ["bevy/dynamic_linking"]

[dependencies]
bevy = { version = "0.13" }
bevy_egui = "0.25"
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
derive_more = "0.99"

[dev-dependencies]
mockall = "0.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
